[package]
name = "rust-query-macros"
version = "0.9.2"
edition = "2021"
description = "Proc-macro crate for rust-query."
repository = "https://github.com/LHolten/rust-query/"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }
heck = "0.5.0"
